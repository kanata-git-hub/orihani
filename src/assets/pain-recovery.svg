<svg xmlns="http://www.w3.org/2000/svg" width="360" height="350" viewBox="0 0 360 350" role="img" aria-labelledby="title desc"><title id="title">만성통증 치료 경과 예시</title><desc id="desc">통증이 오르내리며 줄어드는 경과와 치료를 쉬었을 때 다시 아플 수 있는 경과를 설명한 그림입니다. 원장 임상 경험을 바탕으로 한 설명용 예시이며, 실제 환자의 측정값이나 비교시험 결과가 아닙니다.</desc><rect width="360" height="350" rx="20" fill="#fffdf8"/><g font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#62574d" font-size="20"><text x="24" y="30">통증 강도</text><path d="M34 48V276H336" fill="none" stroke="#baa99b" stroke-width="1.5"/><path d="M34 110H326 M34 190H326" fill="none" stroke="#e8ded1" stroke-dasharray="3 6"/><text x="180" y="174" text-anchor="middle" font-size="43" font-weight="700" fill="#552c24" opacity=".13" transform="rotate(-12 180 174)">오리한의원</text><path d="M158 143 C199 108 252 70 326 66" fill="none" stroke="#b94c2e" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 7"/><path d="M34 65 C50 92 57 155 80 163 S132 147 158 143 C177 170 184 212 206 214 S252 193 270 191 C291 215 297 239 326 248" fill="none" stroke="#21735d" stroke-width="5" stroke-linecap="round"/><g fill="#e0a41c" stroke="#fffdf8" stroke-width="2"><circle cx="34" cy="65" r="6"/><circle cx="158" cy="143" r="6"/><circle cx="270" cy="191" r="6"/></g><text x="34" y="304">0일</text><text x="158" y="304" text-anchor="middle">3일차</text><text x="270" y="304" text-anchor="middle">6일차</text><text x="180" y="335" text-anchor="middle" font-size="13" fill="#76675b">© 오리한의원 · 임상 경험에 따른 경과 예시</text></g></svg>